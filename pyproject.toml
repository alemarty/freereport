[project]
name = "freereport"
version = "0.1.0"
description = "Open-source multi-agent checker that finds math and data errors in academic papers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.0",
    "pymupdf>=1.24",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
freereport = "freereport.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["freereport"]
