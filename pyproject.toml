[project]
name = "freereport"
version = "0.1.0"
description = "Multi-agent checker that finds math and data errors in academic papers."
readme = "README.md"
license = "LicenseRef-All-Rights-Reserved"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.0",
    "pymupdf>=1.24",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
openai = ["openai>=3.40"]
gemini = ["google-genai>=2.30"]
all = ["openai>=3.40", "google-genai>=2.30"]

[project.scripts]
freereport = "freereport.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["freereport"]
